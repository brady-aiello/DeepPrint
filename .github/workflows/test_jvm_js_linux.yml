name: Test JVM, JS, and Linux

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - "**.md"
      - "consumer-smoke-test/**"
      - "deep-print-reflection/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Konan
        uses: ./.github/actions/cache-konan

      # Cheap, and it runs before the build so a stale README is not buried under
      # twenty minutes of Kotlin/Native output.
      - name: Check the README advertises the current version
        run: ./.github/scripts/check-doc-versions.sh

      - name: Test jvm, js(node + browser), linux on Linux
        run: ./gradlew jvmTest jsTest linuxX64Test